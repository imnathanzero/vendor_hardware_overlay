name: Overlay

on:
  workflow_dispatch:
  watch:
   types: [started]
   
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check Out
      uses: actions/checkout@v2

    - name: Prepare the environment
      run: |
        sudo apt -y install git-core git xmlstarlet
        sudo apt update

    - name: Build APK's
      run: |
        cd build
        bash build.sh

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        path: build/RedmiNote144G*.apk
        name: Redmi Note 14 4G Overlays
